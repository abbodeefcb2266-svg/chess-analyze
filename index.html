<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>محلل نقلات الشطرنج</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-xl w-full space-y-6 text-center">
    <h1 class="text-3xl font-bold text-sky-400">محلل نقلات الشطرنج</h1>
    
    <div class="bg-slate-900 p-4 rounded-xl space-y-3 border border-slate-800">
      <textarea
        id="pgnInput"
        class="w-full bg-slate-950 p-3 text-xs font-mono text-sky-300 rounded border border-slate-800 text-left"
        rows="4"
        placeholder="ألصق الـ PGN هنا..."
      ></textarea>
      <button
        onclick="loadPgnGame()"
        class="w-full bg-sky-600 hover:bg-sky-500 text-white py-2 px-6 rounded font-medium transition"
      >
        عرض المباراة
      </button>
    </div>

    <div class="flex justify-center">
      <div id="board" class="w-full max-w-[360px]"></div>
    </div>
  </div>

  <script>
    var board = Chessboard('board', 'start');
    var game = new Chess();

    function loadPgnGame() {
      var pgn = document.getElementById('pgnInput').value.trim();
      if (!pgn) return;
      
      if (game.load_pgn(pgn)) {
        board.position(game.fen());
      } else {
        alert('ملف PGN غير صالح!');
      }
    }
  </script>
</body>
</html>
