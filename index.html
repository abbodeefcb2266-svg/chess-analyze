<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>محلل نقلات الشطرنج</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <style>
    .chess-square {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.8rem, 9vw, 3rem);
      user-select: none;
    }
    .light { background-color: #f0d9b5; color: #1a1a1a; }
    .dark  { background-color: #b58863; color: #1a1a1a; }
    .piece-shadow { text-shadow: 0 0 4px rgba(255,255,255,0.7); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto space-y-6 text-center">
    <h1 class="text-3xl font-bold text-sky-400 mb-6">محلل نقلات الشطرنج</h1>

    <!-- إدخال PGN -->
    <div class="bg-slate-900 p-4 rounded-xl space-y-3 border border-slate-800">
      <textarea
        id="pgnInput"
        class="w-full bg-slate-950 p-3 text-xs font-mono text-sky-300 rounded border border-slate-800 text-left focus:outline-none focus:border-sky-500 transition"
        rows="6"
        placeholder="ألصق الـ PGN هنا..."
      ></textarea>
      <div class="flex flex-col sm:flex-row gap-2 justify-center">
        <button onclick="loadPgnGame()" class="bg-sky-600 hover:bg-sky-500 text-white py-2 px-6 rounded font-medium transition w-full sm:w-auto">
          عرض المباراة وتحليل النقلات
        </button>
        <button onclick="resetGame()" class="bg-rose-600 hover:bg-rose-500 text-white py-2 px-6 rounded font-medium transition w-full sm:w-auto">
          🔄 إعادة تحميل / مسح
        </button>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start text-right">
      
      <!-- الرقعة + أزرار التحكم -->
      <div class="flex flex-col items-center">
        <div class="w-full max-w-[400px] mx-auto aspect-square border-2 border-slate-700 rounded overflow-hidden shadow-2xl">
          <div id="chessBoard" class="grid grid-cols-8 grid-rows-8 w-full h-full"></div>
        </div>

        <!-- أزرار التنقل -->
        <div id="controls" class="hidden flex gap-2 mt-4 flex-wrap justify-center" dir="ltr">
          <button onclick="goToMove(-1)" id="btnStart" class="bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed px-3 py-1.5 rounded text-sm font-bold transition">⏮ بداية</button>
          <button onclick="goToMove(currentIndex - 1)" id="btnPrev" class="bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed px-4 py-1.5 rounded text-sm font-bold transition">◀ ترجيع</button>
          <button onclick="goToMove(currentIndex + 1)" id="btnNext" class="bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed px-4 py-1.5 rounded text-sm font-bold transition">تقديم ▶</button>
          <button onclick="goToMove(moveHistory.length - 1)" id="btnEnd" class="bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed px-3 py-1.5 rounded text-sm font-bold transition">نهاية ⏭</button>
        </div>
      </div>

      <!-- سجل النقلات -->
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 max-h-[450px] overflow-y-auto text-right">
        <h3 class="text-lg font-semibold text-sky-400 mb-3 border-b border-slate-800 pb-2">
          سجل النقلات (<span id="moveCount">0</span>)
        </h3>
        <div id="moveList" class="text-sm text-slate-500 text-center py-8">
          قم بوضع نص PGN واضغط "عرض المباراة" لظهور النقلات هنا.
        </div>
      </div>

    </div>
  </div>

  <script>
    const PIECE_SYMBOLS = {
      'K': '♔', 'Q': '♕', 'R': '♖', 'B': '♗', 'N': '♘', 'P': '♙',
      'k': '♚', 'q': '♛', 'r': '♜', 'b': '♝', 'n': '♞', 'p': '♟'
    };

    let game = new Chess();
    let moveHistory = [];
    let currentIndex = -1;

    function parseFen(fen) {
      const rows = fen.split(' ')[0].split('/');
      let html = '';
      for (let r = 0; r < 8; r++) {
        let col = 0;
        for (let char of rows[r]) {
          if (/\d/.test(char)) {
            const empty = parseInt(char);
            for (let i = 0; i < empty; i++) {
              const isLight = (r + col) % 2 === 0;
              html += `<div class="chess-square ${isLight ? 'light' : 'dark'}"></div>`;
              col++;
            }
          } else {
            const isLight = (r + col) % 2 === 0;
            html += `<div class="chess-square ${isLight ? 'light' : 'dark'}"><span class="piece-shadow">${PIECE_SYMBOLS[char] || char}</span></div>`;
            col++;
          }
        }
      }
      return html;
    }

    function renderBoard() {
      document.getElementById('chessBoard').innerHTML = parseFen(game.fen());
    }

    function updateControls() {
      document.getElementById('btnStart').disabled = currentIndex <= -1;
      document.getElementById('btnPrev').disabled = currentIndex <= -1;
      document.getElementById('btnNext').disabled = currentIndex >= moveHistory.length - 1;
      document.getElementById('btnEnd').disabled = currentIndex >= moveHistory.length - 1;
    }

    function renderMoveList() {
      const container = document.getElementById('moveList');
      document.getElementById('moveCount').textContent = moveHistory.length;
      
      if (moveHistory.length === 0) {
        container.className = 'text-sm text-slate-500 text-center py-8';
        container.innerHTML = 'قم بوضع نص PGN واضغط "عرض المباراة" لظهور النقلات هنا.';
        return;
      }

      container.className = 'grid grid-cols-3 gap-1 text-xs font-mono';
      let html = `
        <div class="text-slate-500 font-bold p-1.5 text-center sticky top-0 bg-slate-900">#</div>
        <div class="text-slate-400 font-bold p-1.5 text-center sticky top-0 bg-slate-900">أبيض</div>
        <div class="text-slate-400 font-bold p-1.5 text-center sticky top-0 bg-slate-900">أسود</div>
      `;

      for (let i = 0; i < moveHistory.length; i += 2) {
        const num = Math.floor(i / 2) + 1;
        const white = moveHistory[i];
        const black = moveHistory[i + 1] || '';
        const whiteIdx = i;
        const blackIdx = i + 1 < moveHistory.length ? i + 1 : -1;

        html += `<div class="text-slate-500 p-1.5 text-center">${num}.</div>`;
        
        html += `
          <button onclick="goToMove(${whiteIdx})" class="p-1.5 rounded transition text-center ${currentIndex === whiteIdx ? 'bg-sky-600 text-white font-bold' : 'hover:bg-slate-800 text-slate-300'}">
            ${white}
          </button>
        `;
        
        if (black) {
          html += `
            <button onclick="goToMove(${blackIdx})" class="p-1.5 rounded transition text-center ${currentIndex === blackIdx ? 'bg-sky-600 text-white font-bold' : 'hover:bg-slate-800 text-slate-300'}">
              ${black}
            </button>
          `;
        } else {
          html += `<div class="p-1.5 text-slate-700 text-center">—</div>`;
        }
      }
      container.innerHTML = html;
    }

    function loadPgnGame() {
      const pgn = document.getElementById('pgnInput').value.trim();
      if (!pgn) {
        alert('الرجاء إدخال نص PGN أولاً');
        return;
      }
      
      const tempGame = new Chess();
      if (tempGame.load_pgn(pgn)) {
        moveHistory = tempGame.history();
        currentIndex = -1;
        game = new Chess();
        renderBoard();
        renderMoveList();
        updateControls();
        const ctrl = document.getElementById('controls');
        ctrl.classList.remove('hidden');
        ctrl.classList.add('flex');
      } else {
        alert('ملف PGN غير صالح! يرجى التأكد من نص المباراة.');
      }
    }

    function resetGame() {
      game = new Chess();
      moveHistory = [];
      currentIndex = -1;
      document.getElementById('pgnInput').value = '';
      renderBoard();
      renderMoveList();
      document.getElementById('moveCount').textContent = '0';
      const ctrl = document.getElementById('controls');
      ctrl.classList.add('hidden');
      ctrl.classList.remove('flex');
    }

    function goToMove(index) {
      if (index < -1 || index >= moveHistory.length) return;
      game = new Chess();
      for (let i = 0; i <= index; i++) {
        game.move(moveHistory[i]);
      }
      currentIndex = index;
      renderBoard();
      updateControls();
      renderMoveList();
    }

    // أسهم الكيبورد
    document.addEventListener('keydown', (e) => {
      if (moveHistory.length === 0) return;
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        goToMove(currentIndex - 1);
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        goToMove(currentIndex + 1);
      }
    });

    // الرقعة الابتدائية
    renderBoard();
  </script>
</body>
</html>
